<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My bookings | PaaniLink</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="nav" class="nav"></header>

  <main class="container">
    <div class="page-head">
      <div>
        <h1>My bookings</h1>
        <p class="muted" id="subsidyLine"></p>
      </div>
      <a class="btn" href="customer-book.html">Book a tanker</a>
    </div>

    <section id="stats" class="stats" aria-label="Summary"></section>

    <section class="card">
      <div class="toolbar">
        <div class="field">
          <label for="statusFilter">Show</label>
          <select id="statusFilter">
            <option value="all">All bookings</option>
            <option value="active">Active</option>
            <option value="history">History</option>
          </select>
        </div>
      </div>
      <div id="bookings"></div>
    </section>
  </main>

  <div id="toast" class="toast-area" aria-live="polite"></div>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/validate.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/customer.js"></script>
</body>
</html>
