<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My trips | PaaniLink</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="nav" class="nav"></header>

  <main class="container">
    <div class="page-head">
      <div>
        <h1>My trips</h1>
        <p class="muted">Only trips assigned to you are shown.</p>
      </div>
      <button id="refresh" class="btn ghost" type="button">Refresh</button>
    </div>

    <h2>Active</h2>
    <section id="activeTrips" class="trip-list" aria-live="polite"></section>

    <h2 style="margin-top:24px">Finished</h2>
    <section id="doneTrips" class="trip-list"></section>
  </main>

  <div id="toast" class="toast-area" aria-live="polite"></div>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/validate.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/driver.js"></script>
</body>
</html>
