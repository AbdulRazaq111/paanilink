<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | PaaniLink</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card wide">
      <h1>Create your account</h1>
      <p class="muted">Register with your CNIC, phone and delivery address.</p>

      <form id="registerForm" class="form-grid" novalidate>
        <div class="field">
          <label for="name">Full name</label>
          <input id="name" name="name" type="text" autocomplete="name">
        </div>
        <div class="field">
          <label for="cnic">CNIC</label>
          <input id="cnic" name="cnic" type="text" inputmode="numeric" placeholder="42101-1234567-1">
        </div>
        <div class="field">
          <label for="phone">Phone number</label>
          <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="03001234567">
        </div>
        <div class="field">
          <label for="zoneId">Zone</label>
          <select id="zoneId" name="zoneId"><option value="">Loading zones...</option></select>
        </div>
        <div class="field full">
          <label for="address">Delivery address</label>
          <textarea id="address" name="address" rows="2" autocomplete="street-address"></textarea>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password">
        </div>
        <div class="field">
          <label for="confirm">Confirm password</label>
          <input id="confirm" name="confirm" type="password" autocomplete="new-password">
        </div>
        <p id="registerError" class="form-error full" role="alert"></p>
        <div class="full">
          <button class="btn big" type="submit">Register</button>
        </div>
      </form>

      <p class="hint">Already registered? <a href="index.html">Log in</a></p>
    </section>
  </main>

  <div id="toast" class="toast-area" aria-live="polite"></div>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/validate.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
